plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.compus'
version = '0.0.1-SNAPSHOT'
description = 'campus-market'
def querydslDir = "$buildDir/generated/querydsl"


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Querydsl 추가
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}

// 루트 .env(모노레포 최상위, 이 파일 기준 한 단계 위)를 읽어 실행/테스트 프로세스의 환경변수로
// 주입한다. Spring Boot는 .env를 자동으로 읽지 않고, application.yml의 ${GEMINI_API_KEY} 같은
// 플레이스홀더는 JVM 프로세스 환경변수(System.getenv)에서 값을 찾기 때문에 필요하다.
def dotenvFile = file("${projectDir}/../.env")
def dotenv = [:]
if (dotenvFile.exists()) {
    dotenvFile.eachLine { rawLine ->
        def line = rawLine.trim()
        if (line && !line.startsWith('#')) {
            def separatorIndex = line.indexOf('=')
            if (separatorIndex > 0) {
                def key = line.substring(0, separatorIndex).trim()
                def value = line.substring(separatorIndex + 1).trim()
                dotenv[key] = value
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    environment(dotenv)
}

tasks.named('bootRun') {
    environment(dotenv)
}

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean {
    delete file(querydslDir)
}
